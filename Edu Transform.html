or gain of hydrogen. In a redox reaction, oxidation and reduction occur simultaneously. The substance that gets oxidised is the reducing agent, and vice versa.",keyPoints:["OIL RIG: Oxidation Is Loss (of electrons), Reduction Is Gain (of electrons)","In 2H₂S + SO₂ → 2H₂O + 3S: H₂S is oxidised (reducing agent), SO₂ is reduced (oxidising agent)","Corrosion = slow oxidation of metals (e.g., iron rusting: 4Fe + 3O₂ + xH₂O → 2Fe₂O₃·xH₂O)","Rancidity = oxidation of fats/oils in food — prevented by antioxidants or nitrogen packing"],formula:"CuO + H₂ → Cu + H₂O  (CuO is reduced; H₂ is oxidised)"}],checkInQuiz:{question:"Which of the following is an example of a decomposition reaction triggered by light (photolytic decomposition)?",options:[{text:"2FeSO₄ → Fe₂O₃ + SO₂ + SO₃ (heat)",isCorrect:!1},{text:"2AgBr → 2Ag + Br₂ (light)",isCorrect:!0},{text:"CaO + H₂O → Ca(OH)₂",isCorrect:!1},{text:"Fe + CuSO₄ → FeSO₄ + Cu",isCorrect:!1}],correctIndex:1,explanation:"Silver bromide (AgBr) decomposes into silver (Ag) and bromine (Br₂) when exposed to light. This photolytic decomposition is used in black-and-white photography. The other options are thermal decomposition (FeSO₄), combination (CaO + H₂O), and displacement (Fe + CuSO₄)."},finalActivity:{prompt:'Write the balanced chemical equation for: Iron reacts with dilute sulphuric acid to form iron(II) sulphate and hydrogen gas. Type the products only (e.g., "FeSO₄ + H₂").',type:"fill",answer:"FeSO₄ + H₂"},xpReward:150,masteryDelta:25},{id:"cls10-maths-realnums-001",title:"Real Numbers — Euclid's Division Lemma & Fundamental Theorem",subject:"Mathematics",grade:10,slides:[{title:"Euclid's Division Lemma",content:"For any two positive integers a and b, there exist unique integers q (quotient) and r (remainder) such that a = bq + r, where 0 ≤ r < b. This fundamental result underpins the Euclidean algorithm for finding the HCF of two numbers.",keyPoints:["Given a = 455, b = 42: 455 = 42 × 10 + 35","Then apply to 42 and 35: 42 = 35 × 1 + 7","Then 35 = 7 × 5 + 0 → HCF(455, 42) = 7","The process stops when remainder = 0; the last divisor is the HCF"],formula:"a = bq + r, where 0 ≤ r < b",example:"Use Euclid's algorithm to find HCF(867, 255): 867 = 255×3 + 102; 255 = 102×2 + 51; 102 = 51×2 + 0. ∴ HCF = 51"},{title:"Fundamental Theorem of Arithmetic",content:"Every composite number can be expressed as a product of primes, and this factorisation is unique (apart from the order of factors). This theorem is foundational to proving irrationality of numbers like √2 and to working with LCM and HCF.",keyPoints:["HCF × LCM = Product of two numbers (for two numbers a and b)","HCF(6, 20) = 2; LCM(6, 20) = 60; 6 × 20 = 120 = 2 × 60 ✓","To prove √2 is irrational: Assume √2 = p/q (lowest terms). Then 2q² = p² → p² is even → p is even → p=2k → 2q²=4k² → q²=2k² → q is even. Contradiction!","Rational numbers have terminating or repeating decimal expansions"],formula:"HCF(a,b) × LCM(a,b) = a × b",example:"252 = 2² × 3² × 7. Find HCF and LCM of 252 and 120 (= 2³ × 3 × 5): HCF = 2² × 3 = 12; LCM = 2³ × 3² × 5 × 7 = 2520"},{title:"Irrational Numbers & Decimal Expansions",content:"A rational number p/q (in lowest terms) has a terminating decimal expansion if and only if q has no prime factors other than 2 and 5. Otherwise, it has a non-terminating repeating decimal. Irrational numbers (√2, √3, π) have non-terminating non-repeating decimals.",keyPoints:["17/8 = 17/2³ → terminating (= 2.125)","64/455 = 64/(5×7×13) → non-terminating repeating (has prime 7, 13)","Prove 3 + 2√5 is irrational: assume rational = p/q; then 2√5 = p/q − 3; √5 = (p−3q)/2q = rational. Contradiction since √5 is irrational.","5/6 = non-terminating repeating = 0.8333..."]}],checkInQuiz:{question:"Find the HCF of 96 and 404 using Euclid's Division Lemma. What is the HCF?",options:[{text:"2",isCorrect:!1},{text:"4",isCorrect:!0},{text:"8",isCorrect:!1},{text:"12",isCorrect:!1}],correctIndex:1,explanation:"404 = 96 × 4 + 20; 96 = 20 × 4 + 16; 20 = 16 × 1 + 4; 16 = 4 × 4 + 0. The last non-zero remainder is 4. Therefore HCF(96, 404) = 4."},finalActivity:{prompt:'Is 7/75 a terminating decimal? Type "Yes" or "No" and identify the prime factors of 75 (e.g., "No — 3, 5²").',type:"fill",answer:"No — 3, 5²"},xpReward:140,masteryDelta:22},{id:"cls12-phy-electro-001",title:"Electrostatics — Electric Charges, Fields & Coulomb's Law",subject:"Physics",grade:12,slides:[{title:"Electric Charge & Properties",content:"Electric charge is a fundamental physical property. There are two types: positive (proton) and negative (electron). Like charges repel; unlike charges attract. Charge is quantised (q = ne, where e = 1.6×10⁻¹⁹ C) and conserved (total charge in an isolated system remains constant).",keyPoints:["SI unit of charge: Coulomb (C)","Charge quantisation: q = ±ne, n ∈ ℤ, e = 1.6×10⁻¹⁹ C","Conservation: Charges can be transferred but not created/destroyed","Methods of charging: friction, conduction, induction","Conductors allow free movement of charge; insulators do not"],formula:"q = ne (where e = 1.6 × 10⁻¹⁹ C)",example:"A glass rod rubbed with silk becomes positively charged (loses electrons); silk becomes negatively charged. Total charge = 0 (conserved)."},{title:"Coulomb's Law",content:"The electrostatic force between two point charges q₁ and q₂ separated by distance r in vacuum is directly proportional to the product of the charges and inversely proportional to the square of the distance between them.",keyPoints:["F = k·q₁·q₂/r² where k = 1/(4πε₀) = 9×10⁹ N·m²/C²","ε₀ (permittivity of free space) = 8.854×10⁻¹² C²/N·m²","Force is along the line joining the charges (central force)","In medium with dielectric constant K: F = q₁q₂/(4πε₀Kr²)","Principle of Superposition: Net force = vector sum of individual forces"],formula:"F = (1/4πε₀) × (q₁q₂/r²)",example:"Two charges of +5μC and −3μC are 20 cm apart. F = (9×10⁹ × 5×10⁻⁶ × 3×10⁻⁶)/(0.20)² = 3.375 N (attractive)"},{title:"Electric Field & Field Lines",content:"Electric field E at a point is defined as the force per unit positive test charge placed at that point. It is a vector quantity. Electric field lines are imaginary lines whose tangent at any point gives the direction of E at that point.",keyPoints:["E = F/q₀ (N/C or V/m)","Due to a point charge q: E = (1/4πε₀) × q/r²","Field lines start from + charge, end at − charge","Field lines never cross each other","Uniform electric field: parallel equally spaced lines (e.g., between parallel plates)","Electric dipole moment p = q × 2a (direction: −q to +q)"],formula:"E = (1/4πε₀) × q/r²  |  Torque on dipole: τ = p × E = pE·sinθ",example:"Electric field at 30 cm from a 5nC charge: E = (9×10⁹ × 5×10⁻⁹)/(0.30)² = 500 N/C"}],checkInQuiz:{question:"Two point charges of +4 μC and −4 μC are placed 0.1 m apart. What is the magnitude of the force between them? (k = 9×10⁹ N·m²/C²)",options:[{text:"1.44 N",isCorrect:!0},{text:"14.4 N",isCorrect:!1},{text:"0.144 N",isCorrect:!1},{text:"144 N",isCorrect:!1}],correctIndex:0,explanation:"F = k·q₁·q₂/r² = (9×10⁹ × 4×10⁻⁶ × 4×10⁻⁶) / (0.1)² = (9×10⁹ × 16×10⁻¹²) / 0.01 = 144×10⁻³ / 0.01 = 14.4×10⁻¹ = 1.44 N. The force is attractive since charges are opposite."},finalActivity:{prompt:'A proton and an electron are 5.3 × 10⁻¹¹ m apart (hydrogen atom radius). The electrostatic force is attractive or repulsive? Type "attractive" or "repulsive".',type:"fill",answer:"attractive"},xpReward:180,masteryDelta:28},{id:"cls12-chem-organic-001",title:"Organic Chemistry — Alcohols, Phenols & Ethers",subject:"Chemistry",grade:12,slides:[{title:"Classification & Nomenclature of Alcohols",content:'Alcohols contain the hydroxyl group (−OH) attached to a saturated carbon. They are classified as primary (1°), secondary (2°), and tertiary (3°) based on the carbon bearing the −OH group. IUPAC names replace the terminal "e" of alkane with "ol".',keyPoints:["Primary alcohol: −OH on carbon bonded to 1 other carbon (e.g., ethanol CH₃CH₂OH)","Secondary: −OH on carbon bonded to 2 carbons (e.g., propan-2-ol)","Tertiary: −OH on carbon bonded to 3 carbons (e.g., 2-methylpropan-2-ol)","Polyhydric alcohols: Ethylene glycol (diol), Glycerol (triol)","Lucas test distinguishes 1°, 2°, 3° alcohols using HCl/ZnCl₂"],formula:"R−OH (general formula for monohydric alcohols)",example:"CH₃CH₂CH₂OH = propan-1-ol (1°); CH₃CH(OH)CH₃ = propan-2-ol (2°)"},{title:"Physical & Chemical Properties of Alcohols",content:"Alcohols have higher boiling points than corresponding hydrocarbons due to intermolecular hydrogen bonding. They undergo dehydration, oxidation, esterification, and reactions with active metals.",keyPoints:["Reaction with Na: 2ROH + 2Na → 2RONa + H₂↑ (alkoxide formed)","Dehydration: alcohol + H₂SO₄ (conc) → alkene + H₂O (at 443K) or ether (at 413K)","Oxidation: 1° → aldehyde → carboxylic acid; 2° → ketone; 3° → no easy oxidation","Lucas test: 3° reacts immediately (turbid); 2° reacts slowly; 1° no reaction at room temp","Esterification: R−OH + R′COOH ⇌ R′COOR + H₂O (acid catalyst)"],formula:"CH₃CH₂OH + [O] → CH₃CHO + [O] → CH₃COOH",example:"Fermentation of glucose: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ (yeast/zymase)"},{title:"Phenols & Ethers",content:"Phenols have −OH directly attached to a benzene ring. They are more acidic than alcohols but less acidic than carboxylic acids. Ethers (R−O−R′) are relatively inert solvents made by dehydration of alcohols.",keyPoints:["Phenol acidity: C₆H₅OH + NaOH → C₆H₅ONa + H₂O (phenol dissolves in NaOH; alcohol does not)","Phenol does NOT react with NaHCO₃ (too weak acid); RCOOH does react","Kolbe's reaction: Phenol + CO₂ + NaOH → Sodium salicylate (aspirin precursor)","Etherification: 2C₂H₅OH → C₂H₅OC₂H₅ + H₂O (413K, H₂SO₄)","Ethers cleave with HI: R−O−R′ + HI → RI + R′OH"],formula:"C₆H₅OH  ⟶(NaOH)  C₆H₅ONa + H₂O"}],checkInQuiz:{question:"Which reagent distinguishes a primary alcohol from a tertiary alcohol at room temperature?",options:[{text:"NaOH solution",isCorrect:!1},{text:"Sodium metal (Na)",isCorrect:!1},{text:"Lucas reagent (conc. HCl + anhydrous ZnCl₂)",isCorrect:!0},{text:"Fehling's solution",isCorrect:!1}],correctIndex:2,explanation:"Lucas reagent (ZnCl₂/HCl) produces a turbid precipitate immediately with tertiary alcohols, slowly with secondary alcohols, and no reaction at room temperature with primary alcohols. This distinguishes 1°, 2°, and 3° alcohols. NaOH and Na react with all alcohols; Fehling's tests for aldehydes, not alcohols."},finalActivity:{prompt:"Ethanol is oxidized to acetic acid (ethanoic acid) in two steps. What is the intermediate compound formed in Step 1? Type the compound name.",type:"fill",answer:"acetaldehyde"},xpReward:175,masteryDelta:26},{id:"cls9-sci-matter-001",title:"Matter in Our Surroundings — States & Changes",subject:"Science",grade:9,slides:[{title:"States of Matter & Particle Theory",content:"Matter is anything that has mass and occupies space. All matter is made up of tiny particles that are in continuous random motion (Brownian motion). The three common states of matter — solid, liquid, gas — differ in the arrangement, distance, and energy of their constituent particles.",keyPoints:["Solid: closely packed, fixed positions, high density, incompressible, definite shape & volume","Liquid: particles close but mobile, takes shape of container, definite volume","Gas: particles far apart, random high-speed motion, highly compressible, fills container","Diffusion occurs in all states; fastest in gases, slowest in solids","Particles of matter have intermolecular forces and intermolecular spaces"],formula:"Kinetic Energy ∝ Temperature (absolute)",example:"A drop of ink in water spreads (diffusion in liquid). Perfume smell in a room (diffusion in gas) — fastest."},{title:"Changes of State & Latent Heat",content:"Matter changes state when heat is added or removed. Key changes: melting (solid→liquid), vaporisation (liquid→gas), sublimation (solid→gas). During a change of state, temperature remains constant despite heat supply — this heat is called latent heat.",keyPoints:["Melting point of ice = 0°C (273 K); latent heat of fusion of ice = 334 J/g","Boiling point of water = 100°C (373 K); latent heat of vaporisation = 2260 J/g","Evaporation ≠ Boiling: evaporation occurs at surface, at any temperature","Evaporation causes cooling (sweat, earthen pots, acetone on palm)","Factors affecting evaporation: surface area, temperature, humidity, wind speed"],formula:"Temperature(K) = Temperature(°C) + 273",example:"Why does an earthen pot keep water cool? Tiny pores allow water to seep through and evaporate, absorbing latent heat from the stored water."}],checkInQuiz:{question:"At what temperature (in Kelvin) does pure water boil at standard atmospheric pressure?",options:[{text:"273 K",isCorrect:!1},{text:"100 K",isCorrect:!1},{text:"373 K",isCorrect:!0},{text:"0 K",isCorrect:!1}],correctIndex:2,explanation:"Water boils at 100°C. To convert to Kelvin: K = °C + 273. So 100 + 273 = 373 K. 273 K is the melting point of ice (0°C)."},finalActivity:{prompt:"Name the process by which camphor (a solid) directly converts to vapour without passing through liquid state.",type:"fill",answer:"sublimation"},xpReward:120,masteryDelta:20},{id:"cls8-maths-algebra-001",title:"Algebraic Expressions & Identities",subject:"Mathematics",grade:8,slides:[{title:"Terms, Factors & Coefficients",content:"An algebraic expression is a combination of variables, constants, and arithmetic operations. Terms are separated by + or −. Each term has factors; the numerical factor is called the coefficient.",keyPoints:["Monomial: one term (e.g., 5xy)","Binomial: two terms (e.g., x² + 3x)","Trinomial: three terms (e.g., x² + 3x − 4)","Like terms: same variable(s) with same exponent(s); can be combined","Coefficient of xy in −7xy² is 0 (xy² ≠ xy)"],example:"In 4x²y − 3xy + 7: terms are 4x²y, −3xy, 7. Coefficient of xy is −3. Constant term is 7."},{title:"Standard Algebraic Identities",content:"Algebraic identities are equations that hold true for ALL values of the variables. NCERT Class 8 introduces four key identities that simplify complex calculations.",keyPoints:["Identity I: (a + b)² = a² + 2ab + b²","Identity II: (a − b)² = a² − 2ab + b²","Identity III: (a + b)(a − b) = a² − b²","Identity IV: (x + a)(x + b) = x² + (a + b)x + ab"],formula:"(a + b)² = a² + 2ab + b²",example:"Find 103² using Identity I: (100 + 3)² = 100² + 2×100×3 + 3² = 10000 + 600 + 9 = 10609"}],checkInQuiz:{question:"Using the identity (a − b)² = a² − 2ab + b², find the value of 97².",options:[{text:"9409",isCorrect:!0},{text:"9604",isCorrect:!1},{text:"9801",isCorrect:!1},{text:"9216",isCorrect:!1}],correctIndex:0,explanation:"97² = (100 − 3)² = 100² − 2×100×3 + 3² = 10000 − 600 + 9 = 9409. Using the identity (a − b)² = a² − 2ab + b² makes mental calculation much faster than direct multiplication."},finalActivity:{prompt:'Expand (2x + 3y)² using the identity (a + b)² = a² + 2ab + b². Type your answer (e.g., "4x² + 12xy + 9y²").',type:"fill",answer:"4x² + 12xy + 9y²"},xpReward:100,masteryDelta:18},{id:"cls6-evs-food-001",title:"Components of Food & Nutrition",subject:"Science",grade:6,slides:[{title:"Nutrients and Their Functions",content:"Our food contains different types of nutrients, each serving specific functions for our body. The main nutrients are carbohydrates, proteins, fats, vitamins, minerals, and water.",keyPoints:["Carbohydrates: main energy source (rice, wheat, potato, sugar)","Proteins: body building and repair (dal, egg, milk, meat, soybean)","Fats: energy reserve, insulation (butter, oil, nuts)","Vitamins & Minerals: protect body from diseases (fruits, vegetables)","Water: 70% of body; transport medium for nutrients"],example:"Iodine test for starch: put iodine on food — turns blue-black if starch is present. Try on rice, potato, bread."},{title:"Deficiency Diseases",content:"When a nutrient is missing from our diet for a long time, we develop a deficiency disease. NCERT lists key deficiency diseases by nutrient.",keyPoints:["Vitamin A deficiency → Night blindness (difficulty seeing in dim light)","Vitamin C deficiency → Scurvy (bleeding gums, swollen joints)","Vitamin D deficiency → Rickets (soft/bent bones in children)","Iron deficiency → Anaemia (pale skin, weakness, tiredness)","Iodine deficiency → Goitre (swelling of thyroid gland in neck)"],example:"A balanced diet contains all nutrients in right amounts — no deficiency or excess."}],checkInQuiz:{question:'Which vitamin deficiency causes "Night Blindness" — difficulty seeing in dim light?',options:[{text:"Vitamin C",isCorrect:!1},{text:"Vitamin D",isCorrect:!1},{text:"Vitamin A",isCorrect:!0},{text:"Vitamin B12",isCorrect:!1}],correctIndex:2,explanation:"Vitamin A (retinol) is essential for producing rhodopsin, a pigment in the retina that enables vision in low light. Deficiency of Vitamin A leads to Night Blindness. Sources: carrots, green leafy vegetables, liver, eggs."},finalActivity:{prompt:"Name the deficiency disease caused by lack of Vitamin C. Type the disease name.",type:"fill",answer:"scurvy"},xpReward:80,masteryDelta:15},{id:"cls11-bio-cell-001",title:"Cell — The Unit of Life (Cell Structure & Organelles)",subject:"Biology",grade:11,slides:[{title:"Prokaryotic vs Eukaryotic Cells",content:"Cells are classified as prokaryotic (no membrane-bound nucleus) and eukaryotic (have a true nucleus). Prokaryotic cells (bacteria, archaea) are smaller and simpler; eukaryotic cells (plants, animals, fungi) are larger with complex organelles.",keyPoints:["Prokaryote: 1–10 μm; circular DNA (nucleoid); no membrane-bound organelles; e.g., E. coli","Eukaryote: 10–100 μm; linear DNA in nucleus; complex organelles; e.g., human cells","Both have: plasma membrane, ribosomes, cytoplasm, DNA","Cell wall: present in bacteria (peptidoglycan), plants (cellulose), fungi (chitin); absent in animal cells","Mycoplasma: smallest living cell; no cell wall"],formula:"1 μm = 10⁻⁶ m; 1 nm = 10⁻⁹ m (cell size reference)",example:"Robert Hooke (1665) first saw dead cork cells. Leeuwenhoek first observed living cells."},{title:"Cell Organelles & Their Functions",content:"Eukaryotic cells contain membrane-bound organelles, each with specialised functions. Understanding their structure is essential for NEET/JEE Biology.",keyPoints:['Mitochondria: "powerhouse" — site of aerobic respiration; ATP synthesis; double membrane; own DNA','Chloroplast: "kitchen" — photosynthesis; has thylakoid (grana) and stroma; own DNA','Nucleus: "control centre" — houses DNA; nuclear envelope with pores; nucleolus (rRNA synthesis)',"Endoplasmic Reticulum: RER (protein synthesis, has ribosomes); SER (lipid synthesis, detox)",'Golgi apparatus: "post office" — processing and packaging of proteins/lipids; forms lysosomes',"Ribosome: 70S (prokaryote); 80S (eukaryote); protein synthesis (translation)"],example:"PPLO (Mycoplasma) — no cell wall, no chloroplasts, just cell membrane + ribosomes + DNA. Simplest life."},{title:"Plasma Membrane & Fluid Mosaic Model",content:'The plasma membrane is a selectively permeable bilayer of phospholipids with embedded proteins. The fluid mosaic model (Singer and Nicolson, 1972) describes it as a "fluid" sea of lipids with floating protein "icebergs".',keyPoints:["Phospholipid bilayer: hydrophilic heads face outside; hydrophobic tails face inside","Integral proteins: span full membrane (transport channels, receptors)","Peripheral proteins: attached to surface (cell identity, enzymes)","Osmosis: movement of water through semi-permeable membrane from hypotonic to hypertonic","Plasmolysis: plant cell shrinks (turgid → flaccid → plasmolysed) in hypertonic solution"],formula:"Osmotic Pressure ∝ Solute Concentration (van't Hoff: π = iMRT)"}],checkInQuiz:{question:'Which cell organelle is called the "powerhouse of the cell" and synthesizes ATP through aerobic respiration?',options:[{text:"Nucleus",isCorrect:!1},{text:"Chloroplast",isCorrect:!1},{text:"Ribosome",isCorrect:!1},{text:"Mitochondria",isCorrect:!0}],correctIndex:3,explanation:"Mitochondria are the sites of aerobic cellular respiration and ATP (adenosine triphosphate) synthesis. They have a double membrane: the inner membrane is folded into cristae, which increases surface area for ATP synthesis. Mitochondria have their own circular DNA and 70S ribosomes, supporting the endosymbiotic theory."},finalActivity:{prompt:"Name the model that describes the structure of the plasma membrane, proposed by Singer and Nicolson in 1972. Type the model name.",type:"fill",answer:"fluid mosaic model"},xpReward:160,masteryDelta:24}],my=[{id:"qc-001",question:"What is the balanced equation for the reaction of iron with dilute sulphuric acid?",answer:`Fe + H₂SO₄ → FeSO₄ + H₂↑
Iron reacts with dilute sulphuric acid to form iron(II) sulphate and hydrogen gas.`,explanation:"This is a displacement reaction. Iron (more reactive) displaces hydrogen from dilute H₂SO₄. The reaction produces light green iron(II) sulphate solution and colourless hydrogen gas that burns with a pop sound.",difficulty:"medium",subject:"Science",grade:10,chapter:"Chemical Reactions & Equations",nextReview:new Date,interval:1,audioTranscript:"Question: What is the balanced equation for iron reacting with dilute sulphuric acid? Answer: Fe + H₂SO₄ → FeSO₄ + H₂. Iron reacts with dilute sulphuric acid to give iron two sulphate and hydrogen gas."},{id:"qc-002",question:"State Euclid's Division Lemma and use it to find HCF(135, 225).",answer:`Euclid's Division Lemma: For a, b > 0, there exist unique q, r such that a = bq + r, 0 ≤ r < b.
HCF(135,225): 225 = 135×1 + 90; 135 = 90×1 + 45; 90 = 45×2 + 0 → HCF = 45`,explanation:"Euclid's Division Lemma is applied repeatedly. 225 ÷ 135 gives remainder 90. 135 ÷ 90 gives remainder 45. 90 ÷ 45 gives remainder 0. The last non-zero remainder (45) is the HCF.",difficulty:"medium",subject:"Mathematics",grade:10,chapter:"Real Numbers",nextReview:new Date,interval:1,audioTranscript:"Question: State Euclid's Division Lemma and find HCF of 135 and 225. Answer: a equals bq plus r. HCF is 45."},{id:"qc-003",question:"Write Coulomb's Law and calculate force between two charges of +3μC and −5μC placed 30 cm apart.",answer:`Coulomb's Law: F = kq₁q₂/r² where k = 9×10⁹ N·m²/C²
F = 9×10⁹ × 3×10⁻⁶ × 5×10⁻⁶ / (0.30)² = 1.5 N (attractive)`,explanation:"Substituting values: numerator = 9×10⁹ × 15×10⁻¹² = 135×10⁻³ = 0.135. Denominator = (0.30)² = 0.09. F = 0.135/0.09 = 1.5 N. Since charges are opposite, force is attractive.",difficulty:"hard",subject:"Physics",grade:12,chapter:"Electrostatics",nextReview:new Date,interval:1,audioTranscript:"Question: State Coulomb's Law and find force between plus 3 micro coulomb and minus 5 micro coulomb at 30 centimetres. Answer: 1.5 Newtons, attractive."},{id:"qc-004",question:"What is the Lucas Test? How does it differentiate between 1°, 2°, and 3° alcohols?",answer:`Lucas Reagent = concentrated HCl + anhydrous ZnCl₂
• 3° alcohol: immediate turbidity (cloudiness)
• 2° alcohol: turbidity after 5 minutes (slow)
• 1° alcohol: no turbidity at room temperature`,explanation:"ZnCl₂ activates the −OH group for substitution by Cl⁻. Tertiary carbocations form fastest (most stable). The alkyl chloride product is insoluble in the Lucas reagent, causing turbidity. Rate: 3° > 2° >> 1° at room temperature.",difficulty:"medium",subject:"Chemistry",grade:12,chapter:"Alcohols, Phenols & Ethers",nextReview:new Date,interval:1,audioTranscript:"Question: What is the Lucas Test? Answer: Conc HCl plus ZnCl2. Tertiary alcohol gives immediate turbidity. Secondary gives turbidity in 5 minutes. Primary gives no turbidity at room temperature."},{id:"qc-005",question:"What is the difference between osmosis and diffusion?",answer:`Diffusion: movement of any substance from high to low concentration; does NOT require a semi-permeable membrane; occurs in solids, liquids, gases.
Osmosis: movement of WATER ONLY from hypotonic (dilute) to hypertonic (concentrated) through a semi-permeable membrane.`,explanation:"Osmosis is a special case of diffusion specifically for water molecules across a semi-permeable membrane. Plants use osmosis for water absorption. Plasmolysis occurs when plant cells lose water in hypertonic solution; turgidity when in hypotonic solution.",difficulty:"easy",subject:"Biology",grade:11,chapter:"Cell — The Unit of Life",nextReview:new Date,interval:1,audioTranscript:"Diffusion moves any substance down concentration gradient without a membrane. Osmosis specifically moves water through a semi-permeable membrane from dilute to concentrated solution."},{id:"qc-006",question:"State and prove that √3 is irrational.",answer:"Assume √3 = p/q (lowest terms, q≠0). Then 3q² = p². So p² is divisible by 3 → p is divisible by 3. Let p = 3m. Then 3q² = 9m² → q² = 3m² → q divisible by 3. But p and q both divisible by 3 contradicts lowest terms. ∴ √3 is irrational. ∎",explanation:"This is a classic NCERT Class 10 proof using contradiction. The key step is: if p² is divisible by prime p₀, then p is also divisible by p₀ (property of primes). This contradiction shows our initial assumption was wrong.",difficulty:"hard",subject:"Mathematics",grade:10,chapter:"Real Numbers",nextReview:new Date,interval:1,audioTranscript:"Prove root 3 is irrational by contradiction. Assume root 3 equals p over q in lowest terms. Then 3q-squared equals p-squared, making p divisible by 3, so p equals 3m. Substituting gives q also divisible by 3, contradicting lowest terms. Therefore root 3 is irrational."},{id:"qc-007",question:"What is Gauss's Law? State it mathematically and give one application.",answer:`Gauss's Law: Total electric flux through any closed surface = net charge enclosed / ε₀
Φ = Q_enc / ε₀ (or ∮E·dA = Q/ε₀)
Application: Electric field due to infinite plane sheet of charge: E = σ/(2ε₀)`,explanation:"Gauss's Law simplifies calculation of electric fields for symmetric charge distributions: spherical (point charge), cylindrical (infinite wire), planar (infinite sheet). The closed imaginary surface is called a Gaussian surface.",difficulty:"hard",subject:"Physics",grade:12,chapter:"Electrostatics",nextReview:new Date,interval:1,audioTranscript:"Gauss Law: Total electric flux equals Q enclosed divided by epsilon naught. Application: Electric field due to an infinite plane sheet equals sigma over 2 epsilon naught."},{id:"qc-008",question:"Name the disease caused by Vitamin C deficiency. What are its symptoms and food sources?",answer:`Disease: Scurvy
Symptoms: Bleeding gums, loose teeth, swollen joints, weakness, delayed wound healing, skin rashes
Food Sources: Amla (richest source), guava, citrus fruits (lemon, orange), tomatoes, spinach`,explanation:"Vitamin C (ascorbic acid) is essential for collagen synthesis. Deficiency leads to weakened blood vessels and connective tissue. Historically, sailors who spent months at sea without fresh fruits developed scurvy. Amla has 20x more Vitamin C than orange.",difficulty:"easy",subject:"Science",grade:6,chapter:"Components of Food",nextReview:new Date,interval:1,audioTranscript:"Vitamin C deficiency causes Scurvy. Symptoms include bleeding gums and joint swelling. Best sources are amla, guava, and citrus fruits."}],ZA={10:[{subjectId:"cls10-science",subjectName:"Science",grade:10,stream:"all",nodes:[{id:"n1",title:"Chemical Reactions",chapter:"Ch.1",mastery:0,prerequisiteIds:[],lessonId:"cls10-sci-chem-001",x:20,y:15,color:"#6366f1"},{id:"n2",title:"Acids, Bases & Salts",chapter:"Ch.2",mastery:0,prerequisiteIds:["n1"],lessonId:"cls10-sci-chem-001",x:45,y:10,color:"#8b5cf6"},{id:"n3",title:"Metals & Non-Metals",chapter:"Ch.3",mastery:0,prerequisiteIds:["n2"],lessonId:"cls10-sci-chem-001",x:70,y:20,color:"#a855f7"},{id:"n4",title:"Life Processes",chapter:"Ch.6",mastery:0,prerequisiteIds:[],lessonId:"cls10-sci-chem-001",x:15,y:50,color:"#22c55e"},{id:"n5",title:"Electricity",chapter:"Ch.12",mastery:0,prerequisiteIds:[],lessonId:"cls10-sci-chem-001",x:60,y:55,color:"#f59e0b"},{id:"n6",title:"Light — Reflection",chapter:"Ch.10",mastery:0,prerequisiteIds:[],lessonId:"cls10-sci-chem-001",x:35,y:75,color:"#06b6d4"},{id:"n7",title:"Heredity & Evolution",chapter:"Ch.9",mastery:0,prerequisiteIds:["n4"],lessonId:"cls10-sci-chem-001",x:80,y:70,color:"#ec4899"}]},{subjectId:"cls10-maths",subjectName:"Mathematics",grade:10,stream:"all",nodes:[{id:"m1",title:"Real Numbers",chapter:"Ch.1",mastery:0,prerequisiteIds:[],lessonId:"cls10-maths-realnums-001",x:20,y:20,color:"#6366f1"},{id:"m2",title:"Polynomials",chapter:"Ch.2",mastery:0,prerequisiteIds:["m1"],lessonId:"cls10-maths-realnu e state; FR prevents state tyranny","Amendments can expand DPSPs but cannot destroy basic structure of FR"],helpfulVotes:44,hasAudio:!1,postedAt:"4 days ago",tags:["Class 11","Political Science","Humanities"]}],QA=[{id:"sr1",type:"feynman",userMessage:"🧠 Feynman Technique: Explain Chemical Reactions simply",response:[`**Step 1 — Teach it like I'm 10:**
Imagine atoms as LEGO bricks. In a chemical reaction, you break apart old LEGO structures (reactants) and rebuild them into completely new structures (products). The total number of LEGO bricks never changes — this is the Law of Conservation of Mass! ⚖️`,`**Step 2 — Where do you get confused?**
Students often confuse physical changes (melting ice → still water) with chemical changes (burning paper → ash + CO₂ — can't go back!). The KEY test: can you reverse it? Chemical reactions usually cannot be reversed simply.`,`**Step 3 — Simplify the equation:**
CH₄ + 2O₂ → CO₂ + 2H₂O
Methane (gas from kitchen) + Oxygen → Carbon dioxide + Water
Count atoms: Left: 1C, 4H, 4O. Right: 1C, 2H×2=4H, 2+2=4O ✓ BALANCED!`,`**Step 4 — Real-world anchor:**
Your phone battery: Li + MnO₂ → LiMnO₂ (chemical reaction powering your device!). Rusting iron, cooking food, photosynthesis — ALL chemical reactions around you! 🌿`],signIcons:["🧱","⚗️","🔄","🌍"]},{id:"sr2",type:"recall",userMessage:"🔍 Active Recall: Quiz me on Class 10 Board questions",response:[`**Board Exam Style Question 1 (2023):**

(a) Name the type of reaction. (b) Write the balanced equation.
*(Answer after thinking: Displacement reaction; Fe + CuSO₄ → FeSO₄ + Cu)*`,`**Board Exam Style Question 2 (2024):**
Why does the colour of copper sulphate solution change when iron is dipped in it?
*(Think: Fe displaces Cu²⁺ because Fe is more reactive; green FeSO₄ replaces blue CuSO₄)*`,`**Board Exam Style Question 3 (3 marks):**
Define: (a) Oxidation (b) Reduction (c) Redox reaction. Give one example of each.
*(Hint: OIL RIG — Oxidation Is Loss, Reduction Is Gain of electrons)*`,"**Scoring tip:** For 3-mark NCERT questions always give: Definition + Example + Equation. That's the marking scheme! 📝"],signIcons:["❓","💡","📋","✏️"]},{id:"sr3",type:"readAloud",userMessage:"🗣️ Read Aloud: Summarize in simplified audio-friendly points",response:["📢 **AUDIO-FRIENDLY SUMMARY — Chemical Reactions (Class 10, Ch.1)**","• POINT ONE: A chemical reaction changes substances permanently. Reactants go in, products come out. Example: Iron rusts → iron oxide. Cannot reverse!","• POINT TWO: Five types — Combination, Decomposition, Displacement, Double Displacement, Redox. Remember C-D-D-D-R!","• POINT THREE: Always balance equations. Same number of atoms on both sides. Law of Conservation of Mass!","• POINT FOUR: Watch for signs — colour change, gas bubbles, precipitate (solid settling), temperature change. These confirm a reaction happened!"],signIcons:["🔊","1️⃣","2️⃣","3️⃣","4️⃣"]}],I$=[{id:"lofi",label:"Lo-Fi",icon:VL,color:"#6366f1"},{id:"rain",label:"Rain",icon:xL,color:"#06b6d4"},{id:"white",label:"White Noise",icon:T$,color:"#64748b"},{id:"pink",label:"Pink Noise",icon:bu,color:"#ec4899"}];function z$(){const{user:e,incrementFocusTime:t}=ia(),{accessibility:n}=Tt(),[r,l]=S.useState(!1),[o,u]=S.useState(1500),[c,d]=S.useState(null),[h,m]=S.useState(0),p=S.useRef(null),v=n.themeMode==="dark",x=n.themeMode==="high-contrast";S.useEffect(()=>(r?p.current=setInterval(()=>{u(O=>{if(O<=0)return l(!1),t(25),m(100),1500;const j=1500-O+1;return m(Math.round(j/1500*100)),O-1})},1e3):p.current&&clearInterval(p.current),()=>{p.current&&clearInterval(p.current)}),[r,t]);const w=O=>`${String(Math.floor(O/60)).padStart(2,"0")}:${String(O%60).padStart(2,"0")}`,C=x?"bg-black border-2 border-yellow-300":v?"bg-gray-800 border border-gray-700":"bg-white border border-indigo-100",A=x?"text-yellow-300":v?"text-gray-100":"text-gray-900",T=x?"text-yellow-200":v?"text-gray-400":"text-gray-500";return b.jsxs("div
